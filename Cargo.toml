[workspace]
resolver = "2"
members = ["crates/cross-env-rs", "crates/test-fixtures/print-env"]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
repository = "https://github.com/Segodnya/cross-env-rs"
authors = ["Kira Kurentsov <immortalsteel@gmail.com>"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
